[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-navigation"
version = "2.0.0"
description = "Partially observed dynamic robot navigation with four native RL algorithms"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "gymnasium>=1.0,<2", "PyYAML>=6,<7", "matplotlib>=3.9,<4", "streamlit>=1.67,<2", "stable-baselines3==2.9.2", "torch>=2.8,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
dqn = ["stable-baselines3==2.9.2", "torch>=2.8,<3"]
ppo = ["stable-baselines3==2.9.2", "torch>=2.8,<3"]

[project.scripts]
robot-nav = "robot_navigation.app_training:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"robot_navigation.ui" = ["styles.css", "guide.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["developer/tests"]
cache_dir = ".runtime/pytest"
norecursedirs = ["archive", ".runtime", ".venv"]
