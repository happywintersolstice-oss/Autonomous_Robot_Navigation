study_id: warehouse-four-algorithm-v1
title: "Autonomous Warehouse Robot Navigation: A Comparative Study of Q-learning, SARSA, DQN and PPO"
map_id: warehouse-delivery-v1
algorithms: [q-learning, sarsa, dqn, ppo]
seeds: [19411, 19421, 19431]
workers: 2
common:
  interactions: 600000
  monitor_every: 100000
  discount: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.03
  epsilon_decay_fraction: 0.8
  training_trace_episodes: 6
  training_trace_starts: [0, 200000, 400000]
  max_wall_seconds: 1800
tabular:
  learning_rate: 0.3
dqn:
  learning_rate: 0.0003
  buffer_size: 50000
  learning_starts: 1000
  batch_size: 64
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 1000
  net_arch: [64, 64]
  torch_threads: 1
ppo:
  learning_rate: 0.0003
  n_steps: 1000
  batch_size: 100
  n_epochs: 10
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [64, 64]
  torch_threads: 1
